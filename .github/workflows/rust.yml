name: Build and Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: rusthound

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libkrb5-dev
    - name: Build default
      run: cargo build --release
    - name: Prepare default artifacts
      run: |
        mkdir -p artifacts/linux-x86_64-default
        cp target/release/rusthound artifacts/linux-x86_64-default/
        cd artifacts
        tar -czf ${{ env.PROJECT_NAME }}-linux-x86_64-default.tar.gz linux-x86_64-default
        sha256sum ${{ env.PROJECT_NAME }}-linux-x86_64-default.tar.gz > ${{ env.PROJECT_NAME }}-linux-x86_64-default.tar.gz.sha256
    - name: Build nogssapi
      run: cargo build --release --no-default-features
    - name: Prepare nogssapi artifacts
      run: |
        mkdir -p artifacts/linux-x86_64-nogssapi
        cp target/release/rusthound artifacts/linux-x86_64-nogssapi/
        cd artifacts
        tar -czf ${{ env.PROJECT_NAME }}-linux-x86_64-nogssapi.tar.gz linux-x86_64-nogssapi
        sha256sum ${{ env.PROJECT_NAME }}-linux-x86_64-nogssapi.tar.gz > ${{ env.PROJECT_NAME }}-linux-x86_64-nogssapi.tar.gz.sha256
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-x86_64
        path: |
          artifacts/${{ env.PROJECT_NAME }}-linux-x86_64-default.tar.gz
          artifacts/${{ env.PROJECT_NAME }}-linux-x86_64-default.tar.gz.sha256
          artifacts/${{ env.PROJECT_NAME }}-linux-x86_64-nogssapi.tar.gz
          artifacts/${{ env.PROJECT_NAME }}-linux-x86_64-nogssapi.tar.gz.sha256

  build-macos-x86_64:
    runs-on: macos-13
    steps:
    - uses: actions/checkout@v4
    - name: Build default
      run: cargo build --release
    - name: Prepare default artifacts
      run: |
        mkdir -p artifacts/macos-x86_64-default
        cp target/release/rusthound artifacts/macos-x86_64-default/
        cd artifacts
        tar -czf ${{ env.PROJECT_NAME }}-macos-x86_64-default.tar.gz macos-x86_64-default
        shasum -a 256 ${{ env.PROJECT_NAME }}-macos-x86_64-default.tar.gz > ${{ env.PROJECT_NAME }}-macos-x86_64-default.tar.gz.sha256
    - name: Build nogssapi
      run: cargo build --release --no-default-features
    - name: Prepare nogssapi artifacts
      run: |
        mkdir -p artifacts/macos-x86_64-nogssapi
        cp target/release/rusthound artifacts/macos-x86_64-nogssapi/
        cd artifacts
        tar -czf ${{ env.PROJECT_NAME }}-macos-x86_64-nogssapi.tar.gz macos-x86_64-nogssapi
        shasum -a 256 ${{ env.PROJECT_NAME }}-macos-x86_64-nogssapi.tar.gz > ${{ env.PROJECT_NAME }}-macos-x86_64-nogssapi.tar.gz.sha256
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-x86_64
        path: |
          artifacts/${{ env.PROJECT_NAME }}-macos-x86_64-default.tar.gz
          artifacts/${{ env.PROJECT_NAME }}-macos-x86_64-default.tar.gz.sha256
          artifacts/${{ env.PROJECT_NAME }}-macos-x86_64-nogssapi.tar.gz
          artifacts/${{ env.PROJECT_NAME }}-macos-x86_64-nogssapi.tar.gz.sha256

  build-macos-aarch64:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build default
      run: cargo build --release
    - name: Prepare default artifacts
      run: |
        mkdir -p artifacts/macos-aarch64-default
        cp target/release/rusthound artifacts/macos-aarch64-default/
        cd artifacts
        tar -czf ${{ env.PROJECT_NAME }}-macos-aarch64-default.tar.gz macos-aarch64-default
        shasum -a 256 ${{ env.PROJECT_NAME }}-macos-aarch64-default.tar.gz > ${{ env.PROJECT_NAME }}-macos-aarch64-default.tar.gz.sha256
    - name: Build nogssapi
      run: cargo build --release --no-default-features
    - name: Prepare nogssapi artifacts
      run: |
        mkdir -p artifacts/macos-aarch64-nogssapi
        cp target/release/rusthound artifacts/macos-aarch64-nogssapi/
        cd artifacts
        tar -czf ${{ env.PROJECT_NAME }}-macos-aarch64-nogssapi.tar.gz macos-aarch64-nogssapi
        shasum -a 256 ${{ env.PROJECT_NAME }}-macos-aarch64-nogssapi.tar.gz > ${{ env.PROJECT_NAME }}-macos-aarch64-nogssapi.tar.gz.sha256
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-aarch64
        path: |
          artifacts/${{ env.PROJECT_NAME }}-macos-aarch64-default.tar.gz
          artifacts/${{ env.PROJECT_NAME }}-macos-aarch64-default.tar.gz.sha256
          artifacts/${{ env.PROJECT_NAME }}-macos-aarch64-nogssapi.tar.gz
          artifacts/${{ env.PROJECT_NAME }}-macos-aarch64-nogssapi.tar.gz.sha256

  create-release:
    needs: [build-linux-x86_64, build-macos-x86_64, build-macos-aarch64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/${{ env.PROJECT_NAME }}-*.tar.gz
            release-assets/${{ env.PROJECT_NAME }}-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
