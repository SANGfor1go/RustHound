name: Release

on:
  push:
    tags:
      - "v*"          # 推送 v 开头的 tag 时自动触发
  workflow_dispatch:  # 允许手动触发

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      fail-fast: false  # 一个平台失败不取消其他平台
      matrix:
        include:
          # Linux 64-bit
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""                     # 二进制文件无后缀
            install_deps: true          # 需要安装 Kerberos 开发库

          # Windows 64-bit
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            install_deps: false

          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            install_deps: false

          # macOS Apple Silicon (可选，如需编译请取消注释)
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   ext: ""
          #   install_deps: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75.0"          # 固定版本，避免 time crate 不兼容
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}    # 不同目标缓存隔离

      # Linux 需要安装 Kerberos 开发库，否则 ldap3/gssapi 链接失败
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && matrix.install_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev

      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }} --verbose

      - name: Prepare artifact
        shell: bash
        run: |
          BIN_NAME="rusthound${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/$BIN_NAME" .
          # 可选：打包为 zip 或 tar.gz
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "rusthound-${{ matrix.target }}.zip" "$BIN_NAME"
          else
            tar czf "rusthound-${{ matrix.target }}.tar.gz" "$BIN_NAME"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusthound-${{ matrix.target }}
          path: |
            rusthound${{ matrix.ext }}
            rusthound-${{ matrix.target }}.*
