name: Build All Platforms (Full)

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - "v*"                 # 打 tag 自动触发

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  # ============================================================
  # macOS ARM64 (Apple Silicon: M1/M2/M3/M4/M5)
  # ============================================================
  build-macos-arm64:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: "default"
            flag: ""
          - name: "nogssapi"
            flag: "--no-default-features --features nogssapi"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.65.0"
          targets: aarch64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-${{ matrix.features.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-arm64-${{ matrix.features.name }}-

      - name: Build (${{ matrix.features.name }})
        run: |
          cargo build --release --target aarch64-apple-darwin ${{ matrix.features.flag }} --verbose 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-macos-arm64-${{ matrix.features.name }}
          path: build.log

      - name: Package binary
        if: success()
        run: |
          BIN="target/aarch64-apple-darwin/release/rusthound"
          codesign --force --sign - "$BIN" || true
          tar czf "rusthound-macos-arm64-${{ matrix.features.name }}.tar.gz" -C target/aarch64-apple-darwin/release rusthound
          shasum -a 256 "rusthound-macos-arm64-${{ matrix.features.name }}.tar.gz" > "rusthound-macos-arm64-${{ matrix.features.name }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rusthound-macos-arm64-${{ matrix.features.name }}
          path: |
            rusthound-macos-arm64-${{ matrix.features.name }}.tar.gz
            rusthound-macos-arm64-${{ matrix.features.name }}.tar.gz.sha256

  # ============================================================
  # macOS x86_64 (Intel Mac)
  # ============================================================
  build-macos-x86_64:
    runs-on: macos-13
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: "default"
            flag: ""
          - name: "nogssapi"
            flag: "--no-default-features --features nogssapi"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.65.0"
          targets: x86_64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-x86_64-${{ matrix.features.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-x86_64-${{ matrix.features.name }}-

      - name: Build (${{ matrix.features.name }})
        run: |
          cargo build --release --target x86_64-apple-darwin ${{ matrix.features.flag }} --verbose 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-macos-x86_64-${{ matrix.features.name }}
          path: build.log

      - name: Package binary
        if: success()
        run: |
          BIN="target/x86_64-apple-darwin/release/rusthound"
          codesign --force --sign - "$BIN" || true
          tar czf "rusthound-macos-x86_64-${{ matrix.features.name }}.tar.gz" -C target/x86_64-apple-darwin/release rusthound
          shasum -a 256 "rusthound-macos-x86_64-${{ matrix.features.name }}.tar.gz" > "rusthound-macos-x86_64-${{ matrix.features.name }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rusthound-macos-x86_64-${{ matrix.features.name }}
          path: |
            rusthound-macos-x86_64-${{ matrix.features.name }}.tar.gz
            rusthound-macos-x86_64-${{ matrix.features.name }}.tar.gz.sha256

  # ============================================================
  # Linux x86_64
  # ============================================================
  build-linux-x86_64:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: "default"
            flag: ""
          - name: "nogssapi"
            flag: "--no-default-features --features nogssapi"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.65.0"
          targets: x86_64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-${{ matrix.features.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-x86_64-${{ matrix.features.name }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libssl-dev pkg-config build-essential

      - name: Build (${{ matrix.features.name }})
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu ${{ matrix.features.flag }} --verbose 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-linux-x86_64-${{ matrix.features.name }}
          path: build.log

      - name: Package binary
        if: success()
        run: |
          BIN="target/x86_64-unknown-linux-gnu/release/rusthound"
          strip "$BIN" || true
          tar czf "rusthound-linux-x86_64-${{ matrix.features.name }}.tar.gz" -C target/x86_64-unknown-linux-gnu/release rusthound
          shasum -a 256 "rusthound-linux-x86_64-${{ matrix.features.name }}.tar.gz" > "rusthound-linux-x86_64-${{ matrix.features.name }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rusthound-linux-x86_64-${{ matrix.features.name }}
          path: |
            rusthound-linux-x86_64-${{ matrix.features.name }}.tar.gz
            rusthound-linux-x86_64-${{ matrix.features.name }}.tar.gz.sha256

  # ============================================================
  # Windows x86_64
  # ============================================================
  build-windows-x86_64:
    runs-on: windows-2019
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: "default"
            flag: ""
          - name: "nogssapi"
            flag: "--no-default-features --features nogssapi"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.65.0"
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-${{ matrix.features.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-x86_64-${{ matrix.features.name }}-

      - name: Build (${{ matrix.features.name }})
        run: |
          cargo build --release --target x86_64-pc-windows-msvc ${{ matrix.features.flag }} --verbose 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows-x86_64-${{ matrix.features.name }}
          path: build.log

      - name: Package binary
        if: success()
        shell: pwsh
        run: |
          $bin = "target/x86_64-pc-windows-msvc/release/rusthound.exe"
          $dest = "rusthound-windows-x86_64-${{ matrix.features.name }}.zip"
          Compress-Archive -Path $bin -DestinationPath $dest
          (Get-FileHash $dest -Algorithm SHA256).Hash + "  " + $dest | Out-File -Encoding ASCII "$dest.sha256"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rusthound-windows-x86_64-${{ matrix.features.name }}
          path: |
            rusthound-windows-x86_64-${{ matrix.features.name }}.zip
            rusthound-windows-x86_64-${{ matrix.features.name }}.zip.sha256

  # ============================================================
  # 创建 GitHub Release（仅在打 tag 时触发）
  # ============================================================
  create-release:
    needs:
      - build-macos-arm64
      - build-macos-x86_64
      - build-linux-x86_64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            ## RustHound ${{ github.ref_name }}

            ### 平台支持
            | 平台 | 架构 | 版本 |
            |------|------|------|
            | macOS | ARM64 (Apple Silicon) | ✅ default / nogssapi |
            | macOS | x86_64 (Intel)    | ✅ default / nogssapi |
            | Linux | x86_64            | ✅ default / nogssapi |
            | Windows | x86_64         | ✅ default / nogssapi |

            ### 版本说明
            - **default**: 完整功能，包含 GSSAPI/Kerberos 支持
            - **nogssapi**: 不含 GSSAPI，仅 TLS 认证（更稳定）

            ### 校验和
            所有文件均附带 SHA256 校验文件。
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
